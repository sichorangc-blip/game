team:
  - id: market_research
    name: 시장조사 담당자
    core_deliverable: 시장 기회/경쟁 분석 리포트
  - id: sns_manager
    name: SNS 게시글 관리자
    core_deliverable: 월간 콘텐츠 캘린더 + 게시글 초안
  - id: store_manager
    name: 쇼핑스토어 운영 담당자
    core_deliverable: 상세페이지/프로모션 최적화안
  - id: product_reviewer
    name: 신제품 개발 검토 담당자
    core_deliverable: MVP 범위 + 리스크 평가
  - id: branding_manager
    name: 브랜딩 담당자
    core_deliverable: 브랜드 메시지 프레임
  - id: ads_manager
    name: 광고 담당자
    core_deliverable: 채널 믹스 + 예산 계획
  - id: designer
    name: 디자이너
    core_deliverable: 디자인 브리프 + 에셋 리스트
